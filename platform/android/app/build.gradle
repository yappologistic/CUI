apply plugin: 'com.android.application'

android {
    namespace 'org.cui.hello'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.cui.hello'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DCUI_ANDROID_APP=hello'
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1+'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
